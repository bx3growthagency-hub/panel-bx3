<title>Panel BX3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: una columna de trabajo (Semana / Mes / Rodajes / Clientes) con selector de persona, navegación inferior en el celular y superior en escritorio; la claqueta del próximo rodaje es el único objeto oscuro. */
:root{
  --bg:#F2F3F0; --surface:#FFFFFF; --ink:#16191A; --muted:#5C6464; --line:#D9DCD6;
  --accent:#2C43C2; --accent-soft:#E6E9FA; --accent-ink:#FFFFFF;
  --late:#B3261E; --late-bg:#FBE8E6; --soon:#8F5400; --soon-bg:#FFF0D4; --ok:#1C6A44; --ok-bg:#E2F1E8;
  --slate:#1A1D1E; --slate-ink:#EEF0EC; --slate-line:#3A4042;
  --seg1:#B9C0F2; --seg2:#2C43C2; --seg3:#E3A63B; --seg4:#3E9B6C;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
  --k1:#2C43C2; --k1-bg:#E6E9FA; --k2:#1C6A44; --k2-bg:#E2F1E8; --k3:#9A4A1F; --k3-bg:#F8E7DC; --k4:#6B3FA0; --k4-bg:#EEE6F7;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111415; --surface:#1A1E1F; --ink:#E7EAE5; --muted:#9BA29F; --line:#2D3334;
  --accent:#93A1FF; --accent-soft:#232A52; --accent-ink:#0D1233;
  --late:#FF8B7F; --late-bg:#3A1916; --soon:#F3B75C; --soon-bg:#33260E; --ok:#7CD2A3; --ok-bg:#12291D;
  --slate:#0A0C0D; --slate-ink:#E7EAE5; --slate-line:#2F3536;
  --seg1:#3B4483; --seg2:#93A1FF; --seg3:#D79A33; --seg4:#4FB283; --k1:#93A1FF; --k1-bg:#232A52; --k2:#7CD2A3; --k2-bg:#12291D; --k3:#F0A57A; --k3-bg:#3A2316; --k4:#C7A6F2; --k4-bg:#2C2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111415; --surface:#1A1E1F; --ink:#E7EAE5; --muted:#9BA29F; --line:#2D3334;
  --accent:#93A1FF; --accent-soft:#232A52; --accent-ink:#0D1233;
  --late:#FF8B7F; --late-bg:#3A1916; --soon:#F3B75C; --soon-bg:#33260E; --ok:#7CD2A3; --ok-bg:#12291D;
  --slate:#0A0C0D; --slate-ink:#E7EAE5; --slate-line:#2F3536;
  --seg1:#3B4483; --seg2:#93A1FF; --seg3:#D79A33; --seg4:#4FB283; --k1:#93A1FF; --k1-bg:#232A52; --k2:#7CD2A3; --k2-bg:#12291D; --k3:#F0A57A; --k3-bg:#3A2316; --k4:#C7A6F2; --k4-bg:#2C2140; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:16px 96px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.label{font:600 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.top .who{display:grid;gap:6px}
.sync{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ok)} .dot.warn{background:var(--soon)} .dot.err{background:var(--late)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.9rem;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:10px 4px 12px;display:grid;justify-items:center;gap:4px;font-weight:600;font-size:.85rem;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.tabs svg{width:22px;height:22px}
.tabs .count{font:600 .7rem/1 var(--f-mono);background:var(--late-bg);color:var(--late);border-radius:99px;padding:2px 6px;position:absolute;top:6px;right:calc(50% - 30px)}
@media (min-width:760px){
  .wrap{padding-bottom:40px}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;display:flex;gap:4px;border:0;border-bottom:1px solid var(--line);background:var(--bg);padding:8px 0 0;margin-bottom:18px}
  .tabs button{display:flex;gap:8px;padding:10px 14px;font-size:.95rem}
  .tabs button[aria-selected="true"]::before{top:auto;bottom:-1px;left:10px;right:10px;border-radius:3px 3px 0 0}
  .tabs .count{position:static}
}

section.view{display:grid;gap:22px;padding-top:18px}
@media (min-width:760px){section.view{padding-top:0}}

/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:4px;min-width:0}
.stat b{font:700 1.7rem/1 var(--f-display);font-stretch:80%;font-variant-numeric:tabular-nums}
.stat.late b{color:var(--late)} .stat.soon b{color:var(--soon)}
.stat span{font-size:.82rem;color:var(--muted);line-height:1.25}

/* Claqueta */
.slate{background:var(--slate);color:var(--slate-ink);border-radius:var(--r);overflow:hidden}
.slate .stripes{height:18px;background:repeating-linear-gradient(-45deg,var(--slate-ink) 0 14px,var(--slate) 14px 28px)}
.slate .grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--slate-line)}
.slate .cell{padding:10px 14px;border-right:1px solid var(--slate-line);border-bottom:1px solid var(--slate-line);min-width:0}
.slate .cell:nth-child(2n){border-right:0}
.slate .cell .label{color:var(--slate-ink);opacity:.62}
.slate .cell .v{font:600 1.05rem/1.25 var(--f-display);font-stretch:85%;margin-top:4px;overflow-wrap:anywhere}
.slate .cell.wide{grid-column:1/-1;border-right:0}
.slate ol{margin:6px 0 0;padding-left:1.25em;display:grid;gap:4px}
.slate li{font-size:.95rem}
.slate li small{opacity:.7}
.slate .foot{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;flex-wrap:wrap}
.slate .btn{background:transparent;color:var(--slate-ink);border-color:var(--slate-line)}

/* Lists */
.group{display:grid;gap:8px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .bar{align-self:stretch;background:transparent}
.row.late .bar{background:var(--late)} .row.soon .bar{background:var(--soon)}
.row .t{min-width:0;display:grid;gap:3px}
.row .t strong{font-weight:600;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.83rem;color:var(--muted);align-items:center}
.chip{font:600 .72rem/1 var(--f-mono);letter-spacing:.03em;padding:4px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pill{font:600 .75rem/1 var(--f-body);padding:5px 9px;border-radius:99px;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.s-curso,.pill.s-PRODUCTION{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.s-bloq,.pill.s-ASSET_NEEDED{background:var(--late-bg);color:var(--late);border-color:transparent}
.pill.s-rev,.pill.s-EDITING,.pill.s-INTERNAL_REVIEW,.pill.s-CLIENT_APPROVAL{background:var(--soon-bg);color:var(--soon);border-color:transparent}
.pill.s-listo,.pill.s-SCHEDULED{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:.95rem}

/* Client cards */
.clients{display:grid;gap:12px}
@media (min-width:760px){.clients{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;align-content:start;min-width:0}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.health{font:600 .72rem/1 var(--f-mono);padding:4px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em}
.health.Verde{background:var(--ok-bg);color:var(--ok)} .health.Amarillo{background:var(--soon-bg);color:var(--soon)} .health.Rojo{background:var(--late-bg);color:var(--late)} .health.none{background:var(--bg);color:var(--muted)}
.role{font-size:.92rem;border-left:3px solid var(--accent);padding-left:10px}
.pipe{display:grid;gap:6px}
.pipebar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.pipebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.card details summary{cursor:pointer;font-weight:600;font-size:.92rem;color:var(--accent);list-style:none}
.card details summary::-webkit-details-marker{display:none}
.card details[open] summary{margin-bottom:8px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* Notices */
.notice{border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;font-size:.93rem;border:1px solid var(--line);background:var(--surface)}
.notice.err{border-color:var(--late);background:var(--late-bg)}
.notice.warn{border-color:var(--soon);background:var(--soon-bg)}
.notice .actions{display:flex;gap:8px;flex-wrap:wrap}
.skel{height:56px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--bg),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite linear;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;text-align:left;font-weight:600;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt:disabled{opacity:.55;cursor:progress}
.copy{font-size:.93rem;background:var(--bg);border-radius:8px;padding:10px 12px;display:grid;gap:4px}
.status-line{font-size:.88rem;min-height:1.2em}
.status-line.err{color:var(--late)} .status-line.ok{color:var(--ok)}

/* Selector de persona */
.people{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.people button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:600;font-size:.88rem;color:var(--muted);min-height:32px}
.people button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.top-right{display:grid;gap:8px;justify-items:end}
@media (max-width:620px){.top-right{justify-items:start}}

/* Mes */
.mes-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mes-nav{display:flex;align-items:center;gap:8px}
.mes-nav h2{min-width:9.5em;text-align:center;text-transform:capitalize}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-weight:600;font-size:.85rem;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.fchip i{width:9px;height:9px;border-radius:50%;background:var(--kc)}
.fchip[aria-pressed="false"]{opacity:.5}
.cal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cal .dow,.cal .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dow div{padding:7px 8px;font:600 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.cal .cell{min-height:104px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .wk .cell:nth-child(7){border-right:0}
.cal .cell.out{background:var(--bg)}
.cal .cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font:700 .95rem/1 var(--f-display);font-stretch:85%;padding:2px 3px;display:flex;justify-content:space-between;gap:4px}
.cal .dn small{font:600 .62rem/1.1 var(--f-body);color:var(--late);text-align:right}
.pc{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--kc);background:var(--kbg);color:var(--ink);border-radius:4px;padding:3px 5px;font-size:.74rem;line-height:1.2;min-width:0}
.pc b{display:block;font:600 .64rem/1.2 var(--f-mono);color:var(--kc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pc.falta{border-left-style:dashed}
.pc.done{opacity:.55}
.agenda{display:none;gap:14px}
.agenda .day{display:grid;gap:6px}
.agenda .day h3{display:flex;gap:8px;align-items:baseline;text-transform:capitalize}
.agenda .day h3 small{font:600 .75rem/1 var(--f-body);color:var(--late);text-transform:none}
.agenda .pc{font-size:.92rem;padding:8px 10px}
.agenda .pc b{font-size:.72rem}
@media (max-width:759px){.cal{display:none}.agenda{display:grid}}
.legend-m{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.copy .ln b{font-weight:600}
</style>

<div class="wrap">
  <header class="top">
    <div class="who">
      <span class="label">BX3 · Operación diaria</span>
      <h1>Panel BX3</h1>
    </div>
    <div class="top-right">
      <div class="sync" id="sync">
        <span class="dot" id="syncDot"></span>
        <span id="syncText">Conectando con Notion…</span>
        <button class="btn" id="refresh" type="button">Actualizar</button>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" id="tab-semana" aria-controls="v-semana" aria-selected="true" data-tab="semana" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Semana</span><span class="count" id="cnt-semana" hidden></span>
    </button>
    <button role="tab" id="tab-mes" aria-controls="v-mes" aria-selected="false" data-tab="mes" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M7.5 13.5h2M11 13.5h2M14.5 13.5h2M7.5 16.5h2M11 16.5h2"/></svg>
      <span>Mes</span>
    </button>
    <button role="tab" id="tab-clientes" aria-controls="v-clientes" aria-selected="false" data-tab="clientes" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4" width="7" height="7" rx="1.5"/><rect x="13.5" y="4" width="7" height="7" rx="1.5"/><rect x="3.5" y="14" width="7" height="7" rx="1.5"/><rect x="13.5" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>Clientes</span>
    </button>
    <button role="tab" id="tab-rodajes" aria-controls="v-rodajes" aria-selected="false" data-tab="rodajes" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3.5 9.5h17V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/><path d="M3.8 9.4 3 5.6l15.6-3.3.8 3.8zM8 4.8l2.4 3.5M13.2 3.7l2.4 3.5"/></svg>
      <span>Rodajes</span><span class="count" id="cnt-rodajes" hidden></span>
    </button>
  </nav>

  <div id="pageNotice"></div>

  <section class="view" id="v-semana" role="tabpanel" aria-labelledby="tab-semana"></section>
  <section class="view" id="v-mes" role="tabpanel" aria-labelledby="tab-mes" hidden></section>
  <section class="view" id="v-clientes" role="tabpanel" aria-labelledby="tab-clientes" hidden></section>
  <section class="view" id="v-rodajes" role="tabpanel" aria-labelledby="tab-rodajes" hidden></section>
</div>

<div id="sheetRoot"></div>

<script>
(() => {
  "use strict";
  const SERVER = "Notion";
  const QUERY = "notion-query-data-sources";
  const UPDATE = "notion-update-page";
  // Saved Notion views. View mode has no per-plan query quota (row queries do on the free plan).
  const VIEWS = {
    clientes: "view://3efda35e-4c95-8165-ba03-000c01ea998d",   // Panel BX3 · Clientes activos
    tareas: "view://3f5da35e-4c95-810d-a6eb-000c281ccbf0",     // Equipo · Tareas abiertas (el panel filtra por persona)
    piezas: "view://3efda35e-4c95-8108-a789-000ce94fe0b9"      // Panel BX3 · Producción (todas las piezas)
  };
  const MAX_PAGES = 6;
  const AUTO_REFRESH_MS = 10 * 60 * 1000;
  // The panel starts on this date (Leandro, 2026-10-09): anything dated before it is hidden here, not deleted in Notion.
  const START_DATE = "2026-10-09";
  const PEOPLE = ["Leandro", "Medrano", "Santiago", "Equipo"];
  const TABS = ["semana", "mes", "rodajes", "clientes"];
  const CLIENT_TONES = ["k1", "k2", "k3", "k4"];
  const MONTHS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const DOW = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];

      h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: () => setTab("rodajes") }, "Ver en Rodajes"))));
    if (next) kids.push(h("div", { class: "group" }, h("div", { class: "group-h" }, h("h2", null, "Próximo rodaje")), slate(next)));
    else if (!loadingPieces) kids.push(h("div", { class: "empty" }, "No hay rodajes con fecha próxima. Cuando una pieza tenga fecha en “Grabar antes de”, aparece acá."));

    if (state.piecesErr) kids.push(noticeFor(state.piecesErr, retryAll));
    kids.push(h("div", { class: "group-h" }, h("h2", null, team() ? "Tareas del equipo" : "Tus tareas"), h("span", { class: "label" }, team() ? "Todos los encargados" : "Encargado: " + state.person)));
    if (state.tasksErr) kids.push(noticeFor(state.tasksErr, retryAll));
    if (!state.tasks && !state.tasksErr) kids.push(skeleton(3));
    if (state.tasks) {
      const groupsT = [["late", "Atrasadas"], ["soon", "Esta semana"], ["later", "Más adelante"], ["none", "Sin fecha"]];
      let any = false;
      for (const [k, name] of groupsT) {
        const rows = tasks.filter((t) => bucket(rangeEnd(t)) === k);
        if (!rows.length) continue;
        any = true;
        kids.push(h("div", { class: "group" }, h("div", { class: "label" }, name + " · " + rows.length), h("div", { class: "list" }, rows.map(taskRow))));
      }
      if (!any) kids.push(h("div", { class: "empty" }, team() ? "No hay tareas abiertas en Notion." : "No tienes tareas abiertas en Notion. Las tareas con Encargado “" + state.person + "” o “Los 3” aparecen acá."));
      if (state.tasksMore) kids.push(h("p", { class: "muted", style: "font-size:.85rem" }, "Se muestran las primeras 100 tareas."));
    }
    v.replaceChildren(...kids.filter(Boolean));

    const late = lateTasks.length + lateShoot.length;
    const c = $("cnt-semana"); c.hidden = !late; c.textContent = late;
  }

  function renderClientes() {
    const v = $("v-clientes");
    const kids = [h("p", { class: "muted", style: "margin:0" }, team() ? "Todos los clientes activos, con el estado de las piezas sin publicar." : "Clientes activos donde " + state.person + " figura como encargado o tiene tareas o piezas asignadas en Notion, con el estado de las piezas sin publicar.")];
    if (state.clientsErr) kids.push(noticeFor(state.clientsErr, retryAll));
    if (!state.clients) { if (!state.clientsErr) kids.push(skeleton(4)); v.replaceChildren(...kids); return; }
    const mine = [...state.clients.values()].filter(isMine).sort((a, b) => String(a.Cliente).localeCompare(String(b.Cliente)));
    if (!mine.length) { kids.push(h("div", { class: "empty" }, "No hay clientes activos con " + state.person + " como encargado.")); v.replaceChildren(...kids); return; }
    const tasks = myTasks();
    kids.push(h("div", { class: "clients" }, mine.map((c) => {
      const url = cleanUrl(c.url);
      const pv = state.pieces ? true : null;
      const perr = state.piecesErr;
      const rows = piecesOf(url);
      const counts = SEGMENTS.map((s) => rows.filter((r) => s.states.includes(r.Estado)).length);
      const total = counts.reduce((a, b) => a + b, 0);
      const toShoot = rows.filter((r) => TO_SHOOT.has(r.Estado) && r["date:Grabar antes de:start"]).map((r) => r["date:Grabar antes de:start"]).sort();
      const nextShoot = toShoot.find((d) => d >= todayISO) || toShoot[0];
      const reelsToShoot = rows.filter((r) => r.Formato === "Reel" && TO_SHOOT.has(r.Estado)).length;
      const myTasks = tasks.filter((t) => clientOf(t) === url);
      const role = roleOf(c);
      const health = c["Salud de cuenta"];
      return h("article", { class: "card" },
        h("div", { class: "card-h" },
          h("div", { style: "display:grid;gap:4px;min-width:0" }, h("h3", null, c.Cliente), h("span", { class: "label" }, c.Estado || "")),
          h("span", { class: "health " + (health || "none") }, health || "Sin dato")),
        role ? h("div", { class: "role" }, h("div", { class: "label", style: "margin-bottom:3px" }, "Lo que te toca"), role) : null,
        h("div", { class: "pipe" },
          h("div", { class: "label" }, perr ? "Piezas: sin datos" : pv ? "Piezas sin publicar · " + total : "Cargando piezas…"),
          perr && !pv ? null : h("div", { class: "pipebar", role: "img", "aria-label": SEGMENTS.map((s, i) => s.name + " " + counts[i]).join(", ") },
            total ? SEGMENTS.map((s, i) => counts[i] ? h("i", { style: "width:" + (counts[i] / total * 100) + "%;background:var(" + s.v + ")" }) : null) : null),
          !perr && total ? h("div", { class: "legend" }, SEGMENTS.map((s, i) => counts[i] ? h("span", null, h("i", { style: "background:var(" + s.v + ")" }), s.name + " " + counts[i]) : null)) : null),
        h("dl", { class: "kv" },
          h("dt", null, "Próxima grabación"), h("dd", { class: "mono" }, nextShoot ? day(nextShoot) + (nextShoot < todayISO ? " · vencida" : "") : "Sin fecha"),
          h("dt", null, "Reels por grabar"), h("dd", { class: "mono" }, pv ? String(reelsToShoot) : "–"),
          h("dt", null, team() ? "Tareas abiertas" : "Tus tareas abiertas"), h("dd", { class: "mono" }, state.tasks ? String(myTasks.length) : "–"),
          c.Bloqueante ? [h("dt", null, "Bloqueante"), h("dd", null, clean(c.Bloqueante))] : null,
          c["Proxima accion"] ? [h("dt", null, "Próxima acción"), h("dd", null, clean(c["Proxima accion"]))] : null),
        myTasks.length || rows.length ? h("details", null,
          h("summary", null, "Ver tareas y piezas"),
          myTasks.length ? h("div", { class: "group", style: "margin-bottom:10px" }, h("div", { class: "label" }, "Tareas"), h("div", { class: "list" }, myTasks.map(taskRow))) : null,
          rows.length ? h("div", { class: "group" }, h("div", { class: "label" }, "Piezas"), h("div", { class: "list" }, rows.slice(0, 30).map(pieceRow))) : null,
          rows.length > 30 ? h("p", { class: "muted", style: "font-size:.85rem" }, "Se muestran 30 de " + rows.length + ". El resto está en Notion.") : null) : null,
        h("a", { href: url, target: "_blank", rel: "noopener", style: "font-size:.9rem;font-weight:600" }, "Ficha del cliente en Notion"));
    })));
    v.replaceChildren(...kids);
  }

  function renderRodajes() {
    const v = $("v-rodajes");
    const toggle = team() ? null : h("label", { class: "toggle" }, h("input", { type: "checkbox", id: "onlyMine", checked: state.onlyMine, onchange: (e) => { state.onlyMine = e.target.checked; try { localStorage.setItem("pm.onlyMine", state.onlyMine ? "1" : "0"); } catch {} renderAll(); } }), "Solo piezas con " + state.person + " como encargado");
    const kids = [h("div", { class: "group-h", style: "flex-wrap:wrap" }, h("p", { class: "muted", style: "margin:0" }, "Piezas sin grabar, agrupadas por fecha límite de grabación y cliente."), toggle)];
    if (state.piecesErr) kids.push(noticeFor(state.piecesErr, retryAll));
    if (state.pieces == null) { if (!state.piecesErr) kids.push(skeleton(4)); v.replaceChildren(...kids); return; }
    const groups = shootGroups();
    if (!groups.length) kids.push(h("div", { class: "empty" }, "No hay piezas pendientes de grabar."));
    if (state.piecesMore) kids.push(h("p", { class: "muted", style: "font-size:.85rem" }, "Hay más piezas en Notion de las que el panel carga de una vez."));
    for (const g of groups) {
      const b = g.date ? bucket(g.date) : "none";
      kids.push(h("div", { class: "group" },
        h("div", { class: "group-h" },
          h("h3", null, (clientName(g.client) || "Cliente") + " · ", h("span", { class: "mono" }, g.date ? day(g.date) : "sin fecha")),
          h("span", { class: "pill " + (b === "late" ? "s-bloq" : b === "soon" ? "s-rev" : "") }, b === "late" ? "Vencida" : b === "soon" ? "Esta semana" : g.pieces.length + " piezas")),
        h("div", { class: "list" }, g.pieces.map(pieceRow))));
    }
    v.replaceChildren(...kids);
    const late = groups.filter((g) => g.date && g.date < todayISO).reduce((a, g) => a + g.pieces.length, 0);
    const c = $("cnt-rodajes"); c.hidden = !late; c.textContent = late;
  }

  function renderPeople() {
    if (!$("people")) return;
    $("people").replaceChildren(...PEOPLE.map((p) => h("button", { type: "button", "aria-pressed": String(state.person === p),
      onclick: () => { state.person = p; try { localStorage.setItem("pm.person", p); } catch {} renderPeople(); renderAll(); } }, p)));
  }

  function shiftMonth(n) {
    const [Y, M] = (state.month || todayISO.slice(0, 7)).split("-").map(Number);
    state.month = new Date(Date.UTC(Y, M - 1 + n, 1)).toISOString().slice(0, 7);
    renderMes();
  }

  function renderMes() {
    const v = $("v-mes");
    const kids = [];
    if (state.piecesErr) kids.push(noticeFor(state.piecesErr, retryAll));
    if (state.pieces == null) { if (!state.piecesErr) kids.push(skeleton(4)); v.replaceChildren(...kids); return; }
    const ym = state.month || todayISO.slice(0, 7);
    const [Y, M] = ym.split("-").map(Number);
    const all = state.pieces.filter((p) => (p["date:Fecha de publicacion:start"] || "").slice(0, 7) === ym)
      .map((p) => Object.assign({ _client: clientOf(p) }, p));
    const clientsHere = [...new Set(all.map((p) => p._client))].sort((a, b) => String(clientName(a) || "").localeCompare(String(clientName(b) || "")));
    const tone = new Map(clientsHere.map((c, i) => [c, CLIENT_TONES[i % CLIENT_TONES.length]]));
    const shown = all.filter((p) => !state.hiddenClients.has(p._client));
    const byDay = new Map();
    for (const p of shown) {
      const d = p["date:Fecha de publicacion:start"].slice(0, 10);
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(p);
    }
    const reels = shown.filter((p) => p.Formato === "Reel").length;
    const falta = shown.filter((p) => p.Estado === "ASSET_NEEDED").length;
    kids.push(h("div", { class: "mes-h" },
      h("div", { class: "mes-nav" },
        h("button", { class: "btn", type: "button", "aria-label": "Mes anterior", onclick: () => shiftMonth(-1) }, "‹"),
        h("h2", null, MONTHS[M - 1] + " " + Y),
        h("button", { class: "btn", type: "button", "aria-label": "Mes siguiente", onclick: () => shiftMonth(1) }, "›")),
      h("span", { class: "label" }, shown.length + " piezas · " + reels + " reels · " + falta + " esperan dato")));
    if (clientsHere.length) kids.push(h("div", { class: "fchips", role: "group", "aria-label": "Clientes" }, clientsHere.map((c) => {
      const on = !state.hiddenClients.has(c);
      return h("button", { class: "fchip", type: "button", "aria-pressed": String(on), style: "--kc:var(--" + tone.get(c) + ")",
        onclick: () => { if (on) state.hiddenClients.add(c); else state.hiddenClients.delete(c); renderMes(); } }, h("i"), clientName(c) || "Sin cliente");
    })));
    if (!all.length) {
      kids.push(h("div", { class: "empty" }, "No hay piezas con fecha de publicación en " + MONTHS[M - 1] + ". Cuando se cargue el calendario del mes en Producción, aparece acá."));
      v.replaceChildren(...kids); return;
    }
    const chip = (p) => {
      const t = tone.get(p._client) || "k1";
      const name = clean(p.Pieza);
      const code = (name.match(/^([RSC]\d+)/) || [])[1] || "";
      const title = name.replace(/^[RSC]\d+\s*·\s*/, "");
      const cls = "pc" + (p.Estado === "ASSET_NEEDED" ? " falta" : "") + (p.Estado === "SCHEDULED" || p.Estado === "PUBLISHED" ? " done" : "");
      return h("button", { class: cls, type: "button", style: "--kc:var(--" + t + ");--kbg:var(--" + t + "-bg)", onclick: () => pieceSheet(p),
        "aria-label": [clientName(p._client), name, PIECE_LABEL[p.Estado] || p.Estado].filter(Boolean).join(", ") },
        h("b", null, [clientName(p._client), code, p.Formato].filter(Boolean).join(" · ")), h("span", null, title));
    };
    const first = new Date(Date.UTC(Y, M - 1, 1));
    const start = new Date(first); start.setUTCDate(1 - ((first.getUTCDay() + 6) % 7));
    const cal = h("div", { class: "cal" }, h("div", { class: "dow" }, DOW.map((d) => h("div", null, d))));
    for (let w = 0; w < 6; w++) {
      const row = h("div", { class: "wk" });
      let anyIn = false;
      for (let d = 0; d < 7; d++) {
        const dt = new Date(start); dt.setUTCDate(start.getUTCDate() + w * 7 + d);
        const iso = dt.toISOString().slice(0, 10);
        const inMonth = dt.getUTCMonth() === M - 1;
        if (inMonth) anyIn = true;
        const cell = h("div", { class: "cell" + (inMonth ? "" : " out") + (iso === todayISO ? " today" : "") });
        if (inMonth) {
          cell.append(h("div", { class: "dn" }, h("span", null, String(dt.getUTCDate())), DAY_TAGS[iso] ? h("small", null, DAY_TAGS[iso]) : null));
          (byDay.get(iso) || []).forEach((p) => cell.append(chip(p)));
        }
        row.append(cell);
      }
      if (anyIn) cal.append(row);
    }
    const ag = h("div", { class: "agenda" }, [...byDay.keys()].sort().map((iso) =>
      h("section", { class: "day" }, h("h3", null, longDay(iso), DAY_TAGS[iso] ? h("small", null, DAY_TAGS[iso]) : null), byDay.get(iso).map(chip))));
    kids.push(cal, ag,
      h("div", { class: "legend-m" }, h("span", null, "Borde punteado: falta un dato del cliente"), h("span", null, "Atenuada: programada o publicada"), h("span", null, "Toca una pieza para ver el guion y cambiar su estado")));
    v.replaceChildren(...kids);
  }

  function renderSync() {
    const errs = [state.clientsErr, state.tasksErr, state.piecesErr].filter(Boolean);
    const hard = errs.filter((e) => !e.transient);
    const dot = $("syncDot"), txt = $("syncText");
    if (!state.mcp) return;
    $("refresh").disabled = state.loading;
    if (state.loading && !state.loadedAt) { dot.className = "dot"; txt.textContent = "Cargando desde Notion…"; }
    else if (hard.length) { dot.className = "dot err"; txt.textContent = "Notion sin conexión"; }
    else if (errs.length) { dot.className = "dot warn"; txt.textContent = state.loadedAt ? "Datos de las " + fmtTime.format(state.loadedAt) : "Notion no responde"; }
    else if (state.loadedAt) { dot.className = "dot live"; txt.textContent = (state.loading ? "Actualizando… " : "Notion · ") + fmtTime.format(state.loadedAt); }
    else { dot.className = "dot"; txt.textContent = "Cargando desde Notion…"; }

    // One page-level notice when every section fails the same way.
    const pn = $("pageNotice");
    const codes = new Set(errs.map((e) => e.code + "|" + e.text));
    if (errs.length === 3 && codes.size === 1) {
      pn.replaceChildren(noticeFor(hard[0], retryAll));
      pn.style.marginTop = "14px";
    } else pn.replaceChildren();
  }

  function renderAll() {
    renderSync();
    renderSemana();
    renderMes();
    renderClientes();
    renderRodajes();
  }

  function setTab(name) {
    state.tab = name;
    for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
    for (const s of TABS) $("v-" + s).hidden = s !== name;
    try { localStorage.setItem("pm.tab", name); } catch {}
    window.scrollTo({ top: 0 });
  }

  // ---------- boot ----------
  try {
    const t = localStorage.getItem("pm.tab"); if (TABS.includes(t)) state.tab = t;
    const m = localStorage.getItem("pm.onlyMine"); if (m) state.onlyMine = m === "1";
  } catch {}
  if (TABS.includes(location.hash.slice(1))) state.tab = location.hash.slice(1);
  for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => setTab(b.dataset.tab));
  $("refresh").addEventListener("click", retryAll);
  setTab(state.tab);
  renderSemana(); renderMes(); renderClientes(); renderRodajes();

  const noMcp = () => {
    $("syncDot").className = "dot err";
    $("syncText").textContent = "Sin conexión a Notion";
    $("refresh").hidden = true;
    $("pageNotice").replaceChildren(h("div", { class: "notice err", style: "margin-top:14px" },
      h("div", null, "Este panel lee y guarda en el Notion de BX3. Ábrelo desde claude.ai con la cuenta de BX3, que tiene Notion conectado."),
      h("div", null, h("a", { href: "https://app.notion.com/p/3efda35e4c9581f4bedec00a0e447a96", target: "_blank", rel: "noopener" }, "Ir al Panel BX3 en Notion"))));
    for (const s of TABS) $("v-" + s).replaceChildren(h("div", { class: "empty" }, "Sin datos: el panel necesita la conexión con Notion."));
  };

  const use = window.claude && typeof window.claude.use === "function" ? window.claude.use.bind(window.claude) : null;
  if (!use) { noMcp(); return; }
  use("permissions").then((p) => { state.perms = p; }).catch(() => {});
  use("mcp").then((mcp) => {
    if (!mcp) { noMcp(); return; }
    state.mcp = mcp;
    loadAll(false);
    setInterval(() => { if (document.visibilityState === "visible") loadAll(false); }, AUTO_REFRESH_MS);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && state.loadedAt && Date.now() - state.loadedAt > AUTO_REFRESH_MS / 2) loadAll(false);
    });
  }).catch(noMcp);
})();
</script>
